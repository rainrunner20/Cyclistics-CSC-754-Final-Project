[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclistics-sim"
version = "0.2.0"
description = "Reproducible discrete-event reference simulation of bicycle-lane obstructions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cyclistics contributors" }]
keywords = ["simulation", "DEVS", "agent-based-modeling", "smart-cities", "bicycle-lanes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
cyclistics = "cyclistics.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
