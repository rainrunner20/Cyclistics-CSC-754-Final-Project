name: Bug report
description: Report an unexpected simulation or tooling failure
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Include reproduction steps and the observed behavior.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime environment
      placeholder: Python 3.12 / Docker Desktop / Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
