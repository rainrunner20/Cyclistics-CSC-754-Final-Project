name: V2 ArcGIS viewer smoke

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/v2-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: |
          node --check web/dashboard.js
          node --check web/lab.js
      - name: Confirm HTML and source paths
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('web/index.html').read_text(encoding='utf-8')
          js = Path('web/dashboard.js').read_text(encoding='utf-8')
          for path in ('./dashboard.js', './styles.css'):
              assert path in page
              assert Path('web', path).is_file()
          assert 'https://js.arcgis.com/5.1/' in page
          assert 'GeoJSONLayer' in js
          assert 'viewOnReady' in js
          assert 'not field validated' in page
          lab = Path('web/lab.html').read_text(encoding='utf-8')
          lab_js = Path('web/lab.js').read_text(encoding='utf-8')
          assert './lab.js' in lab and './lab.css' in lab
          assert Path('web/lab.css').is_file()
          assert './lab.html' in page
          assert 'Python DES' in lab and 'synthetic' in lab
          assert 'cyclistics.visual_lab.v1' in lab_js
          assert 'python -m cyclistics.visual_lab' in lab
          print('PASS: both static viewers are wired and provenance-labeled')
          PY
