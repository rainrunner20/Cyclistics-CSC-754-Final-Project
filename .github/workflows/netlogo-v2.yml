name: Experimental v2 NetLogo mixed-traffic

on:
  pull_request:
    paths:
      - '.github/workflows/netlogo-v2.yml'
      - 'netlogo/Cyclistics_Mixed_Traffic_v2.nlogo'
      - 'netlogo/Cyclistics_Mixed_Traffic_v2.nls'
      - 'netlogo/behaviorspace_v2.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-traffic:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install official NetLogo 6.3.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netlogo"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/netlogo-6.3.0.tgz" \
            "https://downloads.netlogo.org/6.3.0/NetLogo-6.3.0-64.tgz"
          tar -xzf "$RUNNER_TEMP/netlogo-6.3.0.tgz" -C "$RUNNER_TEMP/netlogo"
          headless="$(find "$RUNNER_TEMP/netlogo" -type f -name netlogo-headless.sh -print -quit)"
          test -n "$headless"
          chmod +x "$headless"
          echo "NETLOGO_HEADLESS=$headless" >> "$GITHUB_ENV"

      - name: Run real mixed-traffic simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          cd netlogo
          "$NETLOGO_HEADLESS" \
            --model "$GITHUB_WORKSPACE/netlogo/Cyclistics_Mixed_Traffic_v2.nlogo" \
            --setup-file "$GITHUB_WORKSPACE/netlogo/behaviorspace_v2.xml" \
            --experiment cyclistics-v2-mixed \
            --table "$GITHUB_WORKSPACE/outputs/v2_behaviorspace.csv"
          test -s "$GITHUB_WORKSPACE/outputs/v2_behaviorspace.csv"
          echo 'Headless mixed-traffic output:'
          tail -n 8 "$GITHUB_WORKSPACE/outputs/v2_behaviorspace.csv"
          "$NETLOGO_HEADLESS" \
            --model "$GITHUB_WORKSPACE/netlogo/Cyclistics_Mixed_Traffic_v2.nlogo" \
            --setup-file "$GITHUB_WORKSPACE/netlogo/behaviorspace_v2.xml" \
            --experiment cyclistics-v2-replay \
            --table "$GITHUB_WORKSPACE/outputs/v2_replay_behaviorspace.csv"
          test -s "$GITHUB_WORKSPACE/outputs/v2_replay_behaviorspace.csv"
          "$NETLOGO_HEADLESS" \
            --model "$GITHUB_WORKSPACE/netlogo/Cyclistics_Mixed_Traffic_v2.nlogo" \
            --setup-file "$GITHUB_WORKSPACE/netlogo/behaviorspace_v2.xml" \
            --experiment cyclistics-v2-export \
            --table "$GITHUB_WORKSPACE/outputs/v2_export_behaviorspace.csv"
          test -s "$GITHUB_WORKSPACE/outputs/v2_export_behaviorspace.csv"
          test -s "$GITHUB_WORKSPACE/outputs/v2_trajectories.csv"
          test -s "$GITHUB_WORKSPACE/outputs/v2_metrics.csv"
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(path):
              rows = list(csv.reader(Path(path).open(encoding="utf-8", newline="")))
              start = next(i for i,row in enumerate(rows) if row and row[0] == "[run number]")
              return [dict(zip(rows[start], r)) for r in rows[start+1:] if r]
          main = read("outputs/v2_behaviorspace.csv")
          assert len(main) == 2, main
          assert {r["merging-enabled"] for r in main} == {"0", "1"}
          assert all(r["conservation-ok?"] == "true" for r in main)
          assert all(r["lane-spacing-ok?"] == "true" for r in main)
          assert int(next(r["merge-events"] for r in main if r["merging-enabled"] == "0")) == 0
          replay = read("outputs/v2_replay_behaviorspace.csv")
          assert len(replay) == 1, replay
          assert replay[0]["conservation-ok?"] == "true"
          assert replay[0]["lane-spacing-ok?"] == "true"
          assert int(replay[0]["observed-blocked-ticks"]) == 8, replay
          with Path("outputs/v2_trajectories.csv").open(encoding="utf-8", newline="") as f:
              from csv import DictReader
              traces = list(DictReader(f))
          with Path("outputs/v2_metrics.csv").open(encoding="utf-8", newline="") as f:
              metrics = list(DictReader(f))
          assert traces and metrics and len(metrics) == 1
          assert {r["type"] for r in traces} == {"car", "cyclist"}
          assert {float(r["lane_y"]) for r in traces}.issubset({0.0, 2.0})
          assert metrics[0]["conservation_ok"] == "true"
          assert float(metrics[0]["merges"]) > 0
          print("PASS: mixed traffic, replay ticks, trajectories, and model-metrics CSV")
          PY

      - name: Save actual experimental model output
        uses: actions/upload-artifact@v4
        with:
          name: cyclistics-v2-headless-mixed-traffic
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/v2_behaviorspace.csv
            outputs/v2_replay_behaviorspace.csv
            outputs/v2_export_behaviorspace.csv
            outputs/v2_trajectories.csv
            outputs/v2_metrics.csv
